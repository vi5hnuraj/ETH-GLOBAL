specVersion: 1.3.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: GlobalPayPaymentManager
    network: arc-testnet
    source:
      address: '0x775Ab463A19E51072C61bAe94A0931E00F7caa42'
      abi: GlobalPayPaymentManager
      startBlock: 60772639
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Payment
        - Settlement
        - InvoiceReference
      abis:
        - name: GlobalPayPaymentManager
          file: ./abis/GlobalPayPaymentManager.json
      eventHandlers:
        - event: PaymentCreated(indexed bytes32,indexed uint8,indexed address,address,uint256,uint256)
          handler: handlePaymentCreated
        - event: PaymentReleased(indexed bytes32)
          handler: handlePaymentReleased
        - event: PaymentCancelled(indexed bytes32,uint256)
          handler: handlePaymentCancelled
      file: ./src/mapping.ts
