version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: globalpay-backend
    ports:
      - "5550:5550"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5550
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5550/api/platform/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: globalpay-client
    ports:
      - "8080:80"
    environment:
      - VITE_API_URL=http://localhost:5550/api
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: globalpay-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: globalpay-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    restart: always
